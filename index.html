<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Mi AnnDex Personal</title>
    <link href="styles/main.css" rel="stylesheet">
    <link href="styles/responsive.css" rel="stylesheet">
    <link href="images/favicon.ico" rel="icon">
</head>
<body>
<header>
    <div class="logo">
        <h1>Mi Universo</h1>
        <p>Archivo de personajes y lugares</p>
    </div>
    <nav aria-label="Navegación principal" class="main-nav">
        <ul>
            <li><a data-section="characters" href="#">Personajes</a></li>
            <li><a data-section="locations" href="#">Lugares</a></li>
            <li><a data-section="items" href="#">Objetos</a></li>
            <li><a data-section="books" href="#">Libros</a></li>
            <li><a data-section="about" href="#">Acerca</a></li>
        </ul>
    </nav>
    <div class="search-box" role="search">
        <input aria-label="Campo de búsqueda" id="search-input" placeholder="Buscar personajes, lugares..." type="text">
        <button aria-label="Ejecutar búsqueda" id="search-btn">🔍</button>
    </div>
</header>

<main>
    <div class="sidebar">
        <div class="filters">
            <h3>Categorías</h3>
            <div aria-label="Filtros por categoría" id="category-filters" role="group"></div>
        </div>
        <div class="stats">
            <h3>Estadísticas</h3>
            <div aria-live="polite" id="stats-display">
                <p>Cargando datos...</p>
            </div>
        </div>
    </div>

    <div class="content">
        <div class="grid-container" id="content-grid">
            <div aria-live="polite" class="loading" role="status">
                <p>Cargando datos...</p>
            </div>
        </div>

        <div aria-label="Vista detallada" class="detail-view" id="detail-view" role="article">
            <!-- Vista detallada se mostrará aquí -->
        </div>
    </div>
</main>

<footer>
    <p>Creado con ❤️ | Actualizado: <span id="update-date"></span></p>
    <p>Para agregar contenido, edita los archivos JSON en la carpeta /data</p>
</footer>

<!--
  CADA SCRIPT DEBE CARGAR ANTES DEL SIGUIENTE
  1. images.js → define ImageOptimizer
  2. loader.js → define dataLoader (instancia global)
  3. navigation.js → define NavigationManager
  4. main.js → usa dataLoader y NavigationManager
-->
<script src="scripts/images.js"></script>
<script src="scripts/loader.js"></script>
<script src="scripts/navigation.js"></script>
<script src="scripts/main.js"></script>
</body>
</html>
